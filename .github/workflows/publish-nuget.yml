name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The push to NuGet cannot be undone, so the suite gates it even though the same tests
  # already ran on the PR that produced this commit.
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Treblle.Net.Core.sln --configuration Release

      - name: Test
        run: dotnet test Treblle.Net.Core.sln --configuration Release --no-build

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # enable GitHub OIDC token issuance for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag is the source of truth for the published version; <Version> in the csproj is
      # only a local dev default. A push to NuGet is permanent, so reject a malformed tag
      # before it becomes a package nobody can unpublish.
      - name: Resolve version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG_VERSION"

      - name: Pack
        run: |
          dotnet pack TreblleCore/Treblle.Net.Core.csproj \
            --configuration Release -o ./nupkg \
            -p:Version="${{ steps.version.outputs.version }}"

      # Request the short-lived key immediately before pushing: it is valid for 1 hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
